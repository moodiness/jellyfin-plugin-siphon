  "changelog": "Reuse the successful native media classification attached to an authorized proxy lease for later large seek requests. Avoid repeated byte-zero classification reads that can stall after an origin has already accepted the requested range, while retaining range validation, representation validator checks, HLS rewriting, exact source identity and fail-closed behavior. Add regressions proving that large seeks skip the redundant classification request and still reject changed representations. Verified with 586 tests and the complete owned Jellyfin integration workflow."
