changelog: |-
  - Prepare Siphon 1.5.0.0. Package with scripts/package.py to include the runtime dependency closure and required licenses.
  - Add isolated user addon/search preferences, durable collections/playlists, catalog collections, selected-version resumable downloads, selective history recovery, provenance and source diagnostics, a personal calendar, and durable opt-in notifications.
  - Add all IntroDB timing types and bounded opt-in MonoTorrent playback. Protect post-credit scenes and retain authoritative addon metadata. Offline HLS downloads are explicitly unsupported.
