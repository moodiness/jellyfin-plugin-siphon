  "changelog": "Avoid overlapping classification and media responses within a playback relay request. Classify long byte-zero reads in place and finish prefix classification before seeks or short ranges. Preserve HLS rewriting, exact source selection, authorization and SSRF safeguards; reject conflicting advertised representations and invalid ranges. Add credential-free stage and cause diagnostics for relay failures. Verified with 578 tests and real Jellyfin playback, including bounded reads at 6 GiB and generated HEVC/AAC seeking. Independent FFmpeg requests can still overlap; the reported production NAS failure is not yet verified resolved."
