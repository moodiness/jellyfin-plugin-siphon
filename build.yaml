  "changelog": "Persistent private downloads with pause, priority, per-user quotas, UTC scheduling, batch preparation and explicit track selection; bounded playback admission and read snapshots; opt-in notification adapters and digests; translated administration and personal controls, aggregate local health, offline backup and restore, and verified assets-first publication. Saved-library restoration no longer blocks host startup. Search additions/removals publish only affected titles, recover missing preview artwork, preserve retained history and expose confirmed removal controls. A padded catalog image preserves the original logo. Finite HLS exports support validated video formats; audio-only/live HLS and unsupported DRM are rejected, and resumed HLS jobs restage rather than append."
