  "changelog": "Preserve the exact opened native source for Jellyfin remux, HLS and seek requests after discovery withdrawal by binding a private source snapshot to the user, PlaySessionId and native version. Reuse the already-authorized opaque proxy lease, revalidate permissions, ownership, content and session identity, and fail closed without substituting another version. Add controlled Jellyfin 12.1 coverage for progressive and nested HLS playback, seeking, decoded audio/video and playback revocation. Verified with 584 tests and the complete owned Jellyfin smoke workflow."
