  "changelog": "Fix a Jellyfin startup regression when an existing Siphon catalog exceeds 256 MiB. Large valid state files load and save without truncation, preserving native identities, ownership and metadata; the 100,000-item limit and atomic writes remain enforced. Fix the native integration smoke after publication when source and catalog versions match, update the Node.js action runtime, and pin Linux CI to Ubuntu 24.04."
