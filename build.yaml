  "changelog": "Route native FFmpeg and ffprobe reads through Jellyfin's bound local HTTP address and port instead of the public reverse proxy, while preserving public playback URLs for clients. Keep rewritten HLS playlists, segments and keys on the reader's origin and base path. Avoid reopening and probing an already-probed selected version during remux and seek. Preserve capability authorization, account isolation, range validation and private-host safeguards. Includes regression and real Jellyfin coverage with an unreachable public playback hostname."
