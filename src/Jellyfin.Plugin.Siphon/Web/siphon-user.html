<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>My Siphon · Jellyfin</title>
    <style>
        :root { color-scheme: dark; --accent: #00a4dc; --line: rgba(128,128,128,.3); --panel: rgba(128,128,128,.08); }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body { margin: 0; background: #101010; color: #eee; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { max-width: 68rem; margin: auto; padding: 2rem 1.5rem 4rem; }
        h1 { margin: 0; font-size: 2rem; font-weight: 600; letter-spacing: -.025em; display: flex; align-items: center; gap: .7rem; }
        h1 img { object-fit: contain; }
        h2 { font-size: 1.3rem; margin: 0 0 .5rem; }
        h3 { font-size: 1.05rem; margin: 0 0 .35rem; overflow-wrap: anywhere; }
        p { max-width: 70ch; }
        a { color: var(--accent); overflow-wrap: anywhere; }
        .help { opacity: .78; font-size: .9rem; margin: .4rem 0 1rem; }
        .actions, header { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
        header { justify-content: space-between; }
        button, .button { border: 1px solid var(--line); background: #242424; border-radius: .25rem; color: inherit; font: inherit; cursor: pointer; padding: .65rem 1rem; text-decoration: none; touch-action: manipulation; }
        button:hover, .button:hover { background: #333; }
        button:disabled { opacity: .45; cursor: default; }
        .primary { background: #007ea8; border-color: #007ea8; color: white; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .inputContainer { margin: 0 0 1.25rem; min-width: 0; }
        .inputLabel { display: block; margin-bottom: .45rem; }
        input:not([type="checkbox"]), select { width: 100%; max-width: 100%; background: #202020; border: 1px solid #606060; border-radius: .2rem; color: inherit; font: inherit; padding: .7rem .8rem; }
        input[type="checkbox"] { width: 1.2rem; height: 1.2rem; accent-color: var(--accent); flex-shrink: 0; }
        .checkboxContainer label { display: flex; align-items: flex-start; gap: .6rem; }
        fieldset { margin: 0; border: 0; padding: 0; min-width: 0; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 1.5rem; }
        .tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); gap: .25rem; margin: 1.5rem 0; }
        .tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: transparent; white-space: nowrap; padding: .85rem 1rem; }
        .tabs [aria-selected="true"] { border-bottom-color: var(--accent); font-weight: 600; }
        .message { padding: .8rem 1rem; border-inline-start: 3px solid var(--accent); background: var(--panel); overflow-wrap: anywhere; }
        .message:empty { display: none; }
        .message[data-error="true"] { border-color: #e27777; }
        .list { list-style: none; padding: 0; margin: 1rem 0; }
        .list > li, .row { padding: 1rem 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
        .list p { margin: .35rem 0; }
        .facts { display: grid; grid-template-columns: minmax(7rem, 1fr) minmax(0, 2fr); gap: .4rem 1rem; font-size: .9rem; }
        .facts dt { opacity: .78; }
        .facts dd { margin: 0; overflow-wrap: anywhere; }
        .save { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; border: 1px solid var(--line); padding: 1rem; margin: 1rem 0; background: #202020; }
        .save[data-dirty="true"] { border-color: var(--accent); }
        #signIn { max-width: 30rem; margin: 2rem 0; }
        #notificationsList [data-unread="true"] { border-inline-start: 3px solid var(--accent); padding-inline-start: 1rem; }
        .pager { margin: 1rem 0; }
        progress { width: 100%; height: .6rem; accent-color: var(--accent); }
        .download-state { font-weight: 600; }
        #webhookForm { margin-top: 2rem; border-top: 1px solid var(--line); padding-top: 1.5rem; }
        @media (max-width: 700px) { main { padding: 1.25rem .8rem 2rem; } .grid { grid-template-columns: minmax(0, 1fr); } .tabs button { padding: .75rem .8rem; } .facts { grid-template-columns: minmax(6rem, 1fr) minmax(0, 2fr); } .actions { gap: .5rem; } }
        .compact { max-width: 11rem; }
        .inline-label { display: inline-flex; align-items: center; gap: .5rem; }
        .track-options { margin: .75rem 0; padding: .75rem; border: 1px solid var(--line); }
        .track-options legend { padding: 0 .35rem; }
        .preparation, .batch { border-top: 1px solid var(--line); margin-top: 1.5rem; padding-top: 1rem; }
        .batch-source { margin: .7rem 0; }
        .facts, progress, .download-state { font-variant-numeric: tabular-nums; }
        button:active { transform: translateY(1px); }
        @media (prefers-reduced-motion: no-preference) { button, .button { transition: background-color .15s; } }
    </style>
</head>
<body>
<main id="SiphonUserPage">
    <header><h1><img id="brandIcon" width="44" height="44" alt=""><span data-i18n="user.title">My Siphon</span></h1><div class="actions"><label class="inline-label"><span data-i18n="user.language">Language</span><select id="portalLanguage" class="compact"><option value="en" lang="en">English</option><option value="fr" lang="fr">Français</option></select></label><a id="jellyfinLink" class="button" data-i18n="user.back">Back to Jellyfin</a><button id="signOut" type="button" hidden data-i18n="user.signOut">Sign out of portal</button></div></header>
    <p id="account" class="help" data-i18n="user.accountHelp"></p>
    <p id="sessionStatus" class="message" role="status" aria-live="polite"></p>
    <section id="signIn" aria-labelledby="signInTitle">
        <h2 id="signInTitle" data-i18n="user.signIn">Sign in to Jellyfin</h2>
        <p class="help" data-i18n="user.signInHelp"></p>
        <form id="loginForm"><fieldset id="loginFields">
            <div class="inputContainer"><label class="inputLabel" for="username" data-i18n="user.username">Username</label><input id="username" autocomplete="username" required maxlength="256"></div>
            <div class="inputContainer"><label class="inputLabel" for="password" data-i18n="user.password">Password</label><input id="password" type="password" autocomplete="current-password" maxlength="4096"></div>
            <button type="submit" class="primary" data-i18n="user.login">Sign in</button>
        </fieldset></form>
    </section>
    <div id="authenticated" hidden>
        <nav class="tabs" role="tablist" aria-label="Personal Siphon tools">
            <button id="preferencesTab" role="tab" type="button" aria-controls="preferencesPanel" aria-selected="true" data-i18n="user.preferences">Preferences</button>
            <button id="calendarTab" role="tab" type="button" aria-controls="calendarPanel" aria-selected="false" tabindex="-1" data-i18n="user.calendar">Release calendar</button>
            <button id="notificationsTab" role="tab" type="button" aria-controls="notificationsPanel" aria-selected="false" tabindex="-1" data-i18n="user.notifications">Notifications</button>
            <button id="sourcesTab" role="tab" type="button" aria-controls="sourcesPanel" aria-selected="false" tabindex="-1" data-i18n="user.sources">My sources</button>
            <button id="downloadsTab" role="tab" type="button" aria-controls="downloadsPanel" aria-selected="false" tabindex="-1" data-i18n="user.downloads">Downloads</button>
        </nav>
        <section id="preferencesPanel" role="tabpanel" aria-labelledby="preferencesTab">
            <h2 data-i18n="user.preferencesTitle"></h2><p class="help" data-i18n="user.preferencesHelp"></p>
            <form id="preferencesForm"><fieldset id="preferencesFields" disabled>
                <div class="save" id="preferenceSaveBar" data-dirty="false"><span id="preferenceSaveState" role="status" data-i18n="user.loadingPreferences"></span><div class="actions"><button id="reloadPreferences" type="button" data-i18n="user.reload"></button><button id="savePreferences" type="submit" class="primary" disabled data-i18n="user.savePreferences"></button></div></div>
                <div class="inputContainer"><label class="inputLabel" for="searchMode" data-i18n="user.searchMode"></label><select id="searchMode"><option value="Inherit" data-i18n="user.inherit"></option><option value="All" data-i18n="user.searchAll"></option><option value="Local" data-i18n="user.searchLocal"></option></select></div>
                <div class="inputContainer"><label class="inputLabel" for="hideUnreleased" data-i18n="user.unreleased"></label><select id="hideUnreleased"><option value="inherit" data-i18n="user.inherit"></option><option value="true" data-i18n="user.hideUnreleased"></option><option value="false" data-i18n="user.showAnnounced"></option></select><p class="help" data-i18n="user.datesHelp"></p></div>
                <div class="checkboxContainer"><label><input id="notificationsEnabled" type="checkbox"><span data-i18n="user.notificationsOptIn"></span></label></div>
                <p id="notificationPermission" class="help"></p><p id="effectivePreferences" class="help"></p>
            </fieldset></form>
            <p id="preferencesStatus" class="message" role="status" aria-live="polite"></p><button id="preferencesRetry" type="button" hidden data-i18n="user.retryPreferences"></button>
        </section>
        <section id="calendarPanel" role="tabpanel" aria-labelledby="calendarTab" hidden>
            <h2 data-i18n="user.calendarTitle"></h2><p class="help" data-i18n="user.calendarHelp"></p>
            <form id="calendarForm"><div class="grid"><div class="inputContainer"><label class="inputLabel" for="calendarFrom" data-i18n="user.from"></label><input id="calendarFrom" type="date" required></div><div class="inputContainer"><label class="inputLabel" for="calendarTo" data-i18n="user.through"></label><input id="calendarTo" type="date" required></div></div><div class="actions"><button id="calendarLoad" type="submit" data-i18n="user.loadCalendar"></button><button id="calendarCancel" type="button" hidden data-i18n="user.cancel"></button></div></form>
            <p id="calendarStatus" class="message" role="status" aria-live="polite" data-i18n="user.calendarInitial"></p><ul id="calendarList" class="list"></ul>
        </section>
        <section id="notificationsPanel" role="tabpanel" aria-labelledby="notificationsTab" hidden>
            <h2 data-i18n="user.notificationsTitle"></h2><p class="help" data-i18n="user.notificationsHelp"></p><button id="notificationsLoad" type="button" data-i18n="user.refreshInbox"></button>
            <p id="notificationsStatus" class="message" role="status" aria-live="polite" data-i18n="user.inboxInitial"></p><ul id="notificationsList" class="list"></ul>
            <form id="webhookForm">
                <h3 data-i18n="user.webhookTitle"></h3><p class="help" data-i18n="user.webhookHelp"></p>
                <fieldset id="webhookFields" disabled>
                    <div class="checkboxContainer"><label><input id="webhookEnabled" type="checkbox"><span data-i18n="user.webhookEnabled"></span></label></div>
                    <div class="inputContainer"><label class="inputLabel" for="webhookAdapter" data-i18n="user.adapter"></label><select id="webhookAdapter"><option value="Json" data-i18n="user.adapterJson"></option><option value="Discord" data-i18n="user.adapterDiscord"></option><option value="Slack" data-i18n="user.adapterSlack"></option><option value="Ntfy" data-i18n="user.adapterNtfy"></option></select><p id="webhookSetup" class="help"></p></div>
                    <div class="inputContainer"><label class="inputLabel" for="webhookUrl" data-i18n="user.webhookUrl"></label><input id="webhookUrl" type="url" maxlength="2048" autocomplete="off" spellcheck="false"><p class="help" data-i18n="user.webhookUrlHelp"></p></div>
                    <fieldset class="track-options"><legend data-i18n="user.eventKinds"></legend><div class="checkboxContainer"><label><input id="kindNewEpisode" type="checkbox" checked><span data-i18n="user.NewEpisode"></span></label><label><input id="kindDateChanged" type="checkbox" checked><span data-i18n="user.DateChanged"></span></label><label><input id="kindAnnouncedRelease" type="checkbox" checked><span data-i18n="user.AnnouncedRelease"></span></label></div></fieldset>
                    <div class="inputContainer"><label class="inputLabel" for="webhookDigest" data-i18n="user.digest"></label><input id="webhookDigest" class="compact" type="number" min="0" max="1440" step="1" value="0" required><p class="help" data-i18n="user.digestHelp"></p></div>
                    <div class="actions"><button id="webhookSave" type="submit" class="primary" disabled data-i18n="user.saveWebhook"></button><button id="webhookTest" type="button" disabled data-i18n="user.testWebhook"></button><button id="webhookRotate" type="button" disabled data-i18n="user.rotateSecret"></button></div>
                </fieldset>
                <button id="webhookReload" type="button" data-i18n="user.reload"></button>
                <p id="webhookStatus" class="message" role="status" aria-live="polite"></p><p id="webhookDelivery" class="help"></p>
                <div id="webhookSecretPanel" hidden><label class="inputLabel" for="webhookSecret" data-i18n="user.secret"></label><input id="webhookSecret" type="password" readonly autocomplete="off"><p class="help" data-i18n="user.secretHelp"></p><button id="webhookCopy" type="button" data-i18n="user.copySecret"></button><button id="webhookHide" type="button" data-i18n="user.clearSecret"></button></div>
            </form>
        </section>
        <section id="sourcesPanel" role="tabpanel" aria-labelledby="sourcesTab" hidden>
            <h2 data-i18n="user.sourcesTitle"></h2><p class="help" data-i18n="user.sourcesHelp"></p>
            <form id="itemSearchForm"><div class="inputContainer"><label class="inputLabel" for="itemSearch" data-i18n="user.itemSearch"></label><input id="itemSearch" type="search" maxlength="200" autocomplete="off" required><p class="help" data-i18n="user.itemSearchHelp"></p></div><div class="actions"><button id="itemSearchSubmit" type="submit" data-i18n="user.search"></button><button id="itemSearchCancel" type="button" hidden data-i18n="user.cancelSearch"></button></div></form>
            <p id="itemSearchStatus" class="message" role="status" aria-live="polite"></p><ul id="itemSearchList" class="list"></ul><div class="actions pager"><button id="itemPrevious" type="button" hidden data-i18n="user.previous"></button><button id="itemNext" type="button" hidden data-i18n="user.next"></button></div>
            <form id="sourcesForm"><div class="inputContainer"><label class="inputLabel" for="sourceItem" data-i18n="user.itemId"></label><input id="sourceItem" autocomplete="off" spellcheck="false" required></div><div class="actions"><button id="sourcesLoad" type="submit" data-i18n="user.diagnose"></button><button id="sourcesRefresh" type="button" data-i18n="user.refreshSources"></button><button id="sourcesCancel" type="button" hidden data-i18n="user.cancelView"></button></div></form>
            <p id="sourcesStatus" class="message" role="status" aria-live="polite"></p><div id="sourceResults"></div>
        </section>
        <section id="downloadsPanel" role="tabpanel" aria-labelledby="downloadsTab" hidden>
            <h2 data-i18n="user.downloadsTitle"></h2><p class="help" data-i18n="user.downloadsHelp"></p>
            <div class="actions"><button id="downloadsLoad" type="button" data-i18n="user.refreshDownloads"></button><label class="inline-label"><input id="downloadsAuto" type="checkbox" checked><span data-i18n="user.autoDownloads"></span></label><button id="downloadsSources" type="button" data-i18n="user.chooseSource"></button></div>
            <p id="downloadsStatus" class="message" role="status" aria-live="polite" data-i18n="user.downloadsInitial"></p><p id="downloadsQuota" class="help"></p><p id="downloadsWindow" class="help"></p><p class="help" data-i18n="user.priorityHelp"></p><ul id="downloadsList" class="list"></ul>
            <section class="batch" aria-labelledby="batchTitle"><h3 id="batchTitle" data-i18n="user.batchTitle"></h3><p class="help" data-i18n="user.batchHelp"></p>
                <form id="batchForm"><div class="inputContainer"><label class="inputLabel" for="batchItem" data-i18n="user.batchItem"></label><input id="batchItem" required autocomplete="off" spellcheck="false"></div><div class="actions"><button id="batchPreview" type="submit" data-i18n="user.previewBatch"></button><button id="batchCancel" type="button" hidden data-i18n="user.cancel"></button></div></form>
                <p id="batchStatus" class="message" role="status" aria-live="polite"></p><div id="batchResults"></div><ul id="batchOutcomes" class="list"></ul>
            </section>
        </section>
    </div>
</main>
<script>
(function () {
    'use strict';
    var base = new URL(window.location.href);
    base.pathname = base.pathname.replace(/\/User\/?$/i, '/'); base.search = ''; base.hash = '';
    ['shared.js', 'user-locale.js', 'siphon-user.js'].reduce(function (previous, name) {
        return previous.then(function () { return new Promise(function (resolve, reject) { var script = document.createElement('script'); script.src = new URL('Assets/' + name, base).href; script.onload = resolve; script.onerror = reject; document.head.appendChild(script); }); });
    }, Promise.resolve()).catch(function () {
        var french = (navigator.language || '').toLowerCase().startsWith('fr');
        var status = document.getElementById('sessionStatus'); status.dataset.error = 'true';
        status.textContent = french ? 'Impossible de charger le portail. Rechargez la page ou vérifiez l’installation du plugin.' : 'The portal could not load. Reload the page or check the plugin installation.';
        document.getElementById('loginFields').disabled = true;
    });
}());
</script>
</body>
</html>
